name: Update crypto signals

on:
  schedule:
    # щогодини о хвилині 5 (UTC) — трохи зі зсувом, щоб не бити рівно в топ години разом з усіма
    - cron: "5 * * * *"
  workflow_dispatch: {}   # дозволяє запустити вручну з вкладки Actions

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch signals from CoinGecko
        run: python scripts/fetch_signals.py

      - name: Fetch news from RSS feeds
        run: python scripts/fetch_news.py
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name "signal-deck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: auto-update signals $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
